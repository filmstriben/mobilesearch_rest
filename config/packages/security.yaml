security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        in_memory:
            memory:
                users:
                    '%env(BASIC_AUTH_USER)%':
                        password: '%env(BASIC_AUTH_PASSWORD)%'
                        roles: ['ROLE_USER']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        homepage:
            pattern: ^/$
            lazy: true
            provider: in_memory
            http_basic: ~

        main:
            pattern: ^/
            security: false

    access_control:
        - { path: ^/$, roles: ROLE_USER }
        - { path: ^/, roles: PUBLIC_ACCESS }
